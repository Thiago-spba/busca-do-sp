<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Busca DO-SP</title>
  <desc id="d">Banner do projeto: um marca-texto percorre uma linha de uma página do Diário Oficial e revela uma publicação nova.</desc>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b4a"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <style>
    .titulo { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 80px; fill: #ffffff; }
    .sub    { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 25px; fill: #d4e0ff; }
    .escola { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 18px; fill: #9db4f5; }
    .linha  { fill: #c9d3e6; }
    .texto  { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #14234f; }
    .novo   { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }

    /* Um unico momento de movimento: o marca-texto varre a linha e o selo "novo" aparece. Ciclo de 7s. */
    .marca {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: varrer 7s ease-in-out infinite;
    }
    .selo {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: surgir 7s ease-out infinite;
    }
    @keyframes varrer {
      0%, 14%   { transform: scaleX(0); }
      44%, 92%  { transform: scaleX(1); }
      100%      { transform: scaleX(0); }
    }
    @keyframes surgir {
      0%, 46%   { transform: scale(0); opacity: 0; }
      54%       { transform: scale(1.15); opacity: 1; }
      60%, 92%  { transform: scale(1); opacity: 1; }
      100%      { transform: scale(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .marca { animation: none; transform: scaleX(1); }
      .selo  { animation: none; transform: scale(1); opacity: 1; }
    }
  </style>

  <rect width="1200" height="340" fill="url(#fundo)"/>

  <!-- Texto -->
  <text class="titulo" x="70" y="150">Busca DO-SP</text>
  <text class="sub" x="72" y="204">O Diário Oficial de São Paulo em uma única busca.</text>
  <text class="escola" x="72" y="250">Feito para os servidores da Educação da E.E. Prof. Simão Mathias</text>

  <!-- Página do Diário Oficial -->
  <rect x="768" y="48" width="370" height="260" rx="10" fill="#0a1740" opacity="0.55"/>
  <rect x="760" y="40" width="370" height="260" rx="10" fill="#f4f7fb"/>

  <rect x="784" y="62" width="190" height="14" rx="3" fill="#1e40af"/>
  <rect class="linha" x="784" y="96"  width="322" height="9" rx="4.5"/>
  <rect class="linha" x="784" y="116" width="300" height="9" rx="4.5"/>
  <rect class="linha" x="784" y="136" width="314" height="9" rx="4.5"/>

  <!-- Linha procurada -->
  <rect class="marca" x="780" y="156" width="278" height="28" rx="4" fill="#fbbf24"/>
  <text class="texto" x="790" y="175">Maria Souza — Licença Prêmio</text>
  <g class="selo">
    <rect x="1064" y="159" width="58" height="22" rx="11" fill="#22c55e"/>
    <text class="novo" x="1093" y="174" text-anchor="middle">1 novo!</text>
  </g>

  <rect class="linha" x="784" y="204" width="318" height="9" rx="4.5"/>
  <rect class="linha" x="784" y="224" width="296" height="9" rx="4.5"/>
  <rect class="linha" x="784" y="244" width="322" height="9" rx="4.5"/>
  <rect class="linha" x="784" y="264" width="240" height="9" rx="4.5"/>
</svg>
