<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Fluxo de busca do Busca DO-SP</title>
  <desc id="d">O app envia a busca para as Cloud Functions, que consultam a API oficial do DOE-SP (2024 em diante) e o site da Imprensa Oficial (acervo histórico) ao mesmo tempo e devolvem os resultados separados por fonte.</desc>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7aa2ff"/>
    </marker>
    <marker id="setaAmbar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <style>
    .no     { fill: #16296b; stroke: #3b5bdb; stroke-width: 1.5; }
    .noAtual{ fill: #16296b; stroke: #22c55e; stroke-width: 1.5; }
    .noHist { fill: #16296b; stroke: #fbbf24; stroke-width: 1.5; }
    .h      { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #ffffff; }
    .p      { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; fill: #b8c8f8; }
    .rotulo { font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; font-size: 14px; fill: #fbbf24; }
    .fio    { fill: none; stroke: #7aa2ff; stroke-width: 2.5; stroke-dasharray: 7 9; animation: correr 1.4s linear infinite; }
    .volta  { fill: none; stroke: #fbbf24; stroke-width: 2.5; stroke-dasharray: 7 9; animation: correrVolta 1.4s linear infinite; }
    @keyframes correr      { to { stroke-dashoffset: -32; } }
    @keyframes correrVolta { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) {
      .fio, .volta { animation: none; }
    }
  </style>

  <rect width="1000" height="400" rx="16" fill="#0f1f4d"/>

  <!-- Caminhos -->
  <path class="fio" d="M232,200 L326,200" marker-end="url(#seta)"/>
  <path class="fio" d="M522,185 C585,185 585,115 638,115" marker-end="url(#seta)"/>
  <path class="fio" d="M522,215 C585,215 585,285 638,285" marker-end="url(#seta)"/>
  <path class="volta" d="M425,252 C425,345 135,345 135,252" marker-end="url(#setaAmbar)"/>

  <!-- App -->
  <rect class="no" x="40" y="148" width="190" height="104" rx="12"/>
  <text class="h" x="135" y="188" text-anchor="middle">App web (PWA)</text>
  <text class="p" x="135" y="212" text-anchor="middle">React 19 + Vite</text>
  <text class="p" x="135" y="232" text-anchor="middle">login com Google</text>

  <!-- Cloud Functions -->
  <rect class="no" x="330" y="148" width="190" height="104" rx="12"/>
  <text class="h" x="425" y="188" text-anchor="middle">Cloud Functions</text>
  <text class="p" x="425" y="212" text-anchor="middle">Firebase, Node 24</text>
  <text class="p" x="425" y="232" text-anchor="middle">confere o login e a vaga</text>

  <!-- Acervo atual -->
  <rect class="noAtual" x="640" y="55" width="320" height="120" rx="12"/>
  <text class="h" x="800" y="92" text-anchor="middle">Acervo atual</text>
  <text class="p" x="800" y="118" text-anchor="middle">API JSON oficial do DOE-SP</text>
  <text class="p" x="800" y="140" text-anchor="middle">publicações de 2024 em diante</text>
  <text class="p" x="800" y="160" text-anchor="middle">função buscaAtual</text>

  <!-- Acervo histórico -->
  <rect class="noHist" x="640" y="225" width="320" height="120" rx="12"/>
  <text class="h" x="800" y="262" text-anchor="middle">Acervo histórico</text>
  <text class="p" x="800" y="288" text-anchor="middle">site da Imprensa Oficial (HTML)</text>
  <text class="p" x="800" y="310" text-anchor="middle">lido com cheerio, sem API</text>
  <text class="p" x="800" y="330" text-anchor="middle">função buscaHistorica</text>

  <text class="rotulo" x="280" y="352" text-anchor="middle">resultados juntos, separados por fonte</text>
</svg>
